<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <video autoplay muted loop playsinline src="assests/BackgroundVideo.mp4"></video>
        <div class="overlay">
            <div class="hero-content">
                <img src="assests/Zomato-img.jpg" alt="">
                <h3>India’s #1 <br> food delivery app</h3>
                <p>Experience fast & easy online ordering
                    on the Zomato app</p>
                <div class="hero-buttons">
                    <img class="Google" src="assests/GooglePlay.jpg" alt="">
                    <img class="App" src="assests/AppStore.jpg" alt="">
                    <button>Order Now</button>
                </div>
            </div>
        </div>
    </div>

    <div class="second-content">
        <div class="second-items-content">
            <div class="second-upper">
                <div class="left-burger">
                    <img src="assests/burger.jpg" alt="">
                </div>
                <div class="second-center-content">
                    <h2>Better food for <br> more people</h2>
                    <p>For over a decade, we’ve enabled our customers to discover new tastes, delivered right to their
                        doorstep</p>
                </div>
                <div class="right-momo-pizza">
                    <img src="assests/momo.jpg" alt="">
                    <img src="assests/pizza.jpg" alt="">
                </div>
            </div>

            <div class="second-lower">
                <div class=" box first-box">
                    <div class="box-text">
                        <h4>3,00,000+</h4>
                        <p>restaurants</p>
                    </div>
                    <div class="box-imgage">
                        <img class="home" src="assests/box-home.jpg" alt="">
                    </div>
                </div>
                <div class=" box second-box">
                    <div class="box-text">
                        <h4>800+</h4>
                        <p>cities</p>
                    </div>
                    <div class="box-imgage">
                        <img class="loca" src="assests/box-locatation.jpg" alt="">
                    </div>
                </div>
                <div class=" box third-box">
                    <div class="box-text">
                        <h4>3 billion+</h4>
                        <p>orders delivered</p>
                    </div>
                    <div class="box-imgage">
                        <img class="parcel" src="assests/box-parcel.jpg" alt="">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
