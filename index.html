<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <video autoplay muted loop playsinline src="assests/BackgroundVideo.mp4"></video>
        <div class="overlay">
            <div class="hero-content">
                <img src="assests/Zomato-img.jpg" alt="">
                <h3>India’s #1 <br> food delivery app</h3>

                    on the Zomato app</p>
                <div class="hero-buttons">
                    <img class="Google" src="assests/GooglePlay.jpg" alt="">
                    <img class="App" src="assests/AppStore.jpg" alt="">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
